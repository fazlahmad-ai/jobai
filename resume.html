<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Public Resume | JobAI</title>

<link rel="stylesheet" href="style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

body{

font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;

}


.container{

max-width:800px;
margin:40px auto;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,.1);

}


.profile{

text-align:center;

}


#photo{

width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
display:none;

}


.section{

margin-top:25px;

}


h1,h2{

margin:5px;

}


.footer{

text-align:center;
margin-top:40px;
color:#777;

}


</style>


</head>



<body>


<div class="container">


<div class="profile">


<img id="photo">


<h1 id="name">
Loading...
</h1>


<h2 id="job"></h2>


<p id="email"></p>


</div>



<div class="section">

<h3>
Professional Summary
</h3>

<p id="summary"></p>

</div>



<div class="section">

<h3>
Education
</h3>

<p id="education"></p>

</div>



<div class="section">

<h3>
Work Experience
</h3>

<p id="experience"></p>

</div>



<div class="section">

<h3>
Skills
</h3>

<p id="skills"></p>

</div>



<div class="section">

<h3>
Languages
</h3>

<p id="language"></p>

</div>



<div class="footer">

Created with JobAI
<br>
AI Resume Builder © 2026

</div>



</div>





<script>


const firebaseConfig = {


apiKey: "AIzaSyDC3687Efw3U-_W4lAOF4cQ3j1YyKSyXO0",

authDomain: "jobai-pro.firebaseapp.com",

projectId: "jobai-pro",

storageBucket: "jobai-pro.appspot.com",

messagingSenderId: "352101125474",

appId: "1:352101125474:web:24e03ef92409d1fd9ff03b"

};



firebase.initializeApp(firebaseConfig);



const db = firebase.firestore();



const params =
new URLSearchParams(
window.location.search
);



const id =
params.get("id");



if(id){


db.collection("publicResumes")

.doc(id)

.get()


.then(doc=>{


if(doc.exists){


const data =
doc.data();



document.getElementById("name").innerText =
data.name || "";



document.getElementById("job").innerText =
data.jobTitle || "";



document.getElementById("email").innerText =
data.email || "";



document.getElementById("summary").innerText =
data.summary || "";



document.getElementById("education").innerText =
data.education || "";



document.getElementById("experience").innerText =
data.experience || "";



document.getElementById("skills").innerText =
data.skills || "";



document.getElementById("language").innerText =
data.language || "";





if(data.photoURL){


const img =
document.getElementById("photo");


img.src =
data.photoURL;


img.style.display =
"block";


}



}

else{


document.body.innerHTML =

"<h2 style='text-align:center;margin-top:50px;'>Profile Not Found</h2>";


}



})


.catch(error=>{


console.error(error);


document.body.innerHTML =

"<h2 style='text-align:center;margin-top:50px;'>Error Loading Resume</h2>";


});


}



</script>


</body>

</html>
