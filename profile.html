<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Profile | JobAI</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f5f5f5;

}

.profile{

    max-width:900px;

    margin:40px auto;

    background:#fff;

    border-radius:12px;

    padding:35px;

    box-shadow:0 10px 25px rgba(0,0,0,.1);

}

.photo{

    width:160px;

    height:160px;

    border-radius:50%;

    object-fit:cover;

    display:block;

    margin:auto;

    border:4px solid #0d6efd;

}

h1{

    text-align:center;

    margin-top:20px;

}

h2{

    text-align:center;

    color:#666;

}

.section{

    margin-top:25px;

}

.section h3{

    color:#0d6efd;

    border-bottom:2px solid #eee;

    padding-bottom:8px;

}

.footer{

    margin-top:40px;

    text-align:center;

    color:#777;

}

</style>

</head>

<body>

<div class="profile">

<img id="photo" class="photo" src="" style="display:none;">

<h1 id="name">Loading...</h1>

<h2 id="job"></h2>

<p style="text-align:center;" id="email"></p>

<div class="section">

<h3>Professional Summary</h3>

<p id="summary"></p>

</div>

<div class="section">

<h3>Education</h3>

<p id="education"></p>

</div>

<div class="section">

<h3>Work Experience</h3>

<p id="experience"></p>

</div>

<div class="section">

<h3>Skills</h3>

<p id="skills"></p>

</div>

<div class="section">

<h3>Languages</h3>

<p id="languages"></p>

</div>

<div class="footer">

<b>Created with JobAI</b><br>

AI Resume Builder © 2026

</div>

</div>

<script>

const firebaseConfig = {

apiKey:"YOUR_API_KEY",

authDomain:"jobai-pro.firebaseapp.com",

projectId:"jobai-pro",

storageBucket:"jobai-pro.appspot.com",

messagingSenderId:"",

appId:""

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

if(id){

db.collection("profiles").doc(id).get()

.then(doc=>{

if(doc.exists){

const d = doc.data();

document.getElementById("name").textContent = d.name || "";

document.getElementById("job").textContent = d.job || "";

document.getElementById("email").textContent = d.email || "";

document.getElementById("summary").textContent = d.summary || "";

document.getElementById("education").textContent = d.education || "";

document.getElementById("experience").textContent = d.experience || "";

document.getElementById("skills").textContent = d.skills || "";

document.getElementById("languages").textContent = d.languages || "";

if(d.photo){

const img = document.getElementById("photo");

img.src = d.photo;

img.style.display = "block";

}

}else{

document.body.innerHTML="<h2 style='text-align:center'>Profile Not Found</h2>";

}

});

}

</script>

</body>

</html>
