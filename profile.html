<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobAI Professional Profile</title>


<style>

body{

font-family: Arial, sans-serif;
background:#f4f6f8;
padding:30px;

}


.profile-card{

max-width:600px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
text-align:center;

}


.profile-card img{

width:120px;
height:120px;
border-radius:50%;
object-fit:cover;

}


h1{

color:#2563eb;

}


.skill{

background:#eef2ff;
padding:10px;
border-radius:8px;
margin-top:10px;

}


.not-found{

color:red;
font-size:22px;

}


</style>


</head>


<body>



<div id="profile" class="profile-card">


<h2>
Loading Profile...
</h2>


</div>






<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>





<script>


const firebaseConfig = {


apiKey: "AIzaSyDC3687Efw3U-_W4lAOF4cQ3j1YyKSyXO0",

authDomain: "jobai-pro.firebaseapp.com",

projectId: "jobai-pro",

storageBucket: "jobai-pro.appspot.com",

messagingSenderId: "352101125474",

appId: "1:352101125474:web:24e03ef92409d1fd9ff03b"

};



firebase.initializeApp(firebaseConfig);



const db = firebase.firestore();





// گرفتن ID از لینک


const params = new URLSearchParams(
window.location.search
);


const id = params.get("id");





const profileBox =
document.getElementById("profile");





if(!id){


profileBox.innerHTML = `

<div class="not-found">

Profile Not Found

</div>

`;



}

else{


db.collection("professionalProfiles")

.doc(id)

.get()



.then(doc=>{


if(doc.exists){



const data = doc.data();



profileBox.innerHTML = `


${data.photoURL ? 

`<img src="${data.photoURL}">`

:

""

}



<h1>

${data.name || "No Name"}

</h1>



<h3>

${data.title || ""}

</h3>



<p>

${data.email || ""}

</p>



<div class="skill">

Skills:

<br>

${data.skills || ""}

</div>



<div class="skill">

Education:

<br>

${data.education || ""}

</div>



<div class="skill">

Experience:

<br>

${data.experience || ""}

</div>



<div class="skill">

Language:

<br>

${data.language || ""}

</div>



<p>

Created with JobAI

</p>


`;



}

else{


profileBox.innerHTML = `

<div class="not-found">

Profile Not Found

</div>

`;



}



})


.catch(error=>{


console.error(error);


profileBox.innerHTML = `

<div class="not-found">

Error Loading Profile

</div>

`;



});



}



</script>



</body>

</html>
